version: 1
name: saline_paddy_water_carbon_nitrogen
queries:
  - id: Q1_saline_water_gas
    description: 盐碱稻田灌溉和温室气体，不限年份
    query: 'TS=(salin* OR alkal* OR sodic OR "salt affected") AND TS=(rice OR paddy) AND TS=(irrigat* OR flood* OR drain* OR "water management" OR "wetting and drying") AND TS=(methane OR nitrous OR greenhouse OR CH4 OR N2O)'
    database: WOS
    sort: PY+D
    enabled: true
  - id: Q2_saline_water_carbon_nitrogen
    description: 盐碱稻田灌溉与碳氮过程，不限年份
    query: 'TS=(salin* OR alkal* OR sodic OR "salt affected") AND TS=(rice OR paddy) AND TS=(irrigat* OR flood* OR drain* OR "water management" OR "wetting and drying") AND TS=(carbon OR nitrogen OR nitrification OR denitrification OR mineralization)'
    database: WOS
    sort: PY+D
    enabled: true
  - id: Q3_transfer_water_gas
    description: 非限定盐度的稻田水管理和碳氮温室气体机制，用作间接证据
    query: 'TS=(rice OR paddy) AND TS=("alternate wetting and drying" OR "intermittent irrigation") AND TS=(methane OR "nitrous oxide") AND TS=(salin* OR alkal* OR sodic)'
    database: WOS
    sort: PY+D
    enabled: true
