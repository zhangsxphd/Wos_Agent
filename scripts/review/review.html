<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Wos_Agent 人工审核</title><style>
:root{font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d3035;background:#f4f7f5}body{margin:0}header{background:#153d3b;color:white;padding:18px 3vw}h1{font-size:21px;margin:0}header p{margin:4px 0;color:#d4e7e0}main{max-width:1450px;margin:auto;padding:20px}nav,.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button,select,input,textarea{font:inherit;border:1px solid #b4c7c2;border-radius:6px;padding:8px;background:white}button{cursor:pointer}button.active,button.primary{background:#145f52;color:white;border-color:#145f52}.bar{align-items:center}.grid{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:14px}.list,.panel{background:white;border:1px solid #d9e3df;border-radius:9px;padding:15px}.list{max-height:75vh;overflow:auto}.item{display:block;text-align:left;width:100%;margin-bottom:7px;font-size:13px}.item strong{display:block}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.columns>section{min-width:0}.muted{color:#566c67}.badge{color:#126c59;font-weight:600}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7f5;padding:12px;border-radius:6px;max-height:25em;overflow:auto}img{display:block;max-width:100%;border:1px solid #cbdad4;margin:8px 0}textarea,input,select{box-sizing:border-box;width:100%}textarea{min-height:95px}label{display:block;margin:10px 0 4px;font-weight:600}details{margin:10px 0}a{color:#126c59}#notice{color:#a43b22}@media(max-width:850px){.grid,.columns{grid-template-columns:1fr}.list{max-height:25vh}}
</style></head><body><header><h1>Wos_Agent 人工审核</h1><p>离线使用 · 自动结果仅供核对 · 所有未操作项目保持待审核</p></header><main><nav id="tabs"></nav><div class="bar"><label for="reviewer">审核人</label><input id="reviewer" style="width:180px" placeholder="填写姓名或标识"><button id="download" class="primary">下载审核结果 JSONL</button><span id="summary"></span></div><p class="muted">先选左侧论文，核对原文与候选；需要决定时填写审核人、选择结果并保存。记录保存在本浏览器，下载后交回 Codex。切勿把文件上传到公共网站。</p><div class="bar"><select id="filter" style="width:auto"></select><input id="search" style="width:240px" placeholder="搜索题名或 DOI"></div><div class="grid"><aside class="list" id="list"></aside><div class="panel" id="detail">请选择一项。</div></div><p id="notice"></p></main><script>
'use strict';const packet=__PACKET_JSON__;const key='wos-review-'+packet.manifest_sha256;let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let kind='abstract',selected=null;const labels={abstract:'摘要核对',fulltext:'PDF 身份',year_policy:'年份规则',screening:'相关性初筛'};const translations={accept:'通过',correct:'需要修正',reject:'拒绝候选',uncertain:'不确定',identity_confirmed:'身份一致',identity_conflict:'身份冲突',needs_reprocessing:'需要重新解析',include_core:'核心证据',include_methods:'方法参考',include_background:'背景参考',exclude:'排除',first_online:'首次在线发表年份',issue_year:'正式刊期年份',defer:'暂缓决定'};
const el=(tag,text)=>{let e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e};const id=t=>t.type+':'+t.uid;const get=t=>state[id(t)]||{status:'pending',decision:'',reviewer:'',reviewed_at:'',notes:''};function appendText(parent,title,value){if(value===null||value===undefined||value==='')return;parent.append(el('h4',title));let p=el('pre',typeof value==='string'?value:JSON.stringify(value,null,2));parent.append(p)}
function tabs(){let node=document.getElementById('tabs');node.replaceChildren();for(const k of Object.keys(labels)){let b=el('button',labels[k]);b.className=k===kind?'active':'';b.onclick=()=>{kind=k;selected=null;filters();render()};node.append(b)}}function filters(){let f=document.getElementById('filter');f.replaceChildren();let opts=kind==='abstract'?[['priority','优先 7 篇'],['all','全部 46 篇']]:kind==='screening'?[['possible_core_review','可能相关（关键词线索）'],['all','全部 280 篇'],['uncertain_insufficient_scope_evidence','信息不足'],['technical_ready','有可用全文'],['not_available','全文缺失'],['needs_review','全文待处理']]:[['all','全部']];for(let [v,l] of opts){let o=el('option',l);o.value=v;f.append(o)}}
function render(){tabs();let f=document.getElementById('filter').value,q=document.getElementById('search').value.toLowerCase();let rows=packet.tasks.filter(t=>t.type===kind&&(!q||(t.title+' '+t.doi).toLowerCase().includes(q))&&(f==='all'||(f==='priority'&&t.data.priority)||t.data.automatic_suggestion===f||t.data.fulltext_admission===f));let list=document.getElementById('list');list.replaceChildren();if(!rows.length)list.append(el('p','没有匹配项目，可切换为“全部”。'));for(const t of rows){let b=el('button');b.className='item'+(selected&&id(t)===id(selected)?' active':'');b.append(el('strong',t.doi||t.title),el('span',t.title+' · '+(get(t).status==='pending'?'待审核':'已记录')));b.onclick=()=>{selected=t;render()};list.append(b)}let decided=Object.values(state).filter(x=>x.status==='decided').length;document.getElementById('summary').textContent=`已记录 ${decided} 项；其余待审核`;detail()}
function detail(){let d=document.getElementById('detail');d.replaceChildren();if(!selected){d.append(el('p','请选择左侧项目。'));return}let t=selected,x=t.data;d.append(el('h2',t.title),el('p',`${t.doi}  ${t.uid}`));let cols=el('div');cols.className='columns';let left=el('section'),right=el('section');cols.append(left,right);d.append(cols);left.append(el('h3','原文与线索'));right.append(el('h3','候选与人工决定'));let raw=t.files.find(f=>f.role==='raw_file');if(raw){let a=el('a','打开本地原始 PDF');a.href='../../../'+raw.path;a.target='_blank';a.rel='noopener';left.append(a)}for(let src of x.preview_images||[]){let img=el('img');img.src=src;img.alt='论文原文页面预览';left.append(img)}if(t.type==='abstract'){appendText(left,'PDF 第 1–2 页 pypdf 提取文本',x.pdf_extracted_pages);appendText(left,'PDF 第 1–2 页 pdfplumber 提取文本',x.pdfplumber_extracted_pages);appendText(right,'原有摘要',x.existing_abstract);appendText(right,'候选摘要（需核对）',x.candidate_abstract);appendText(right,'首页文本不同处（可能包含题名和元数据，仅供定位）',x.first_page_differences);appendText(right,'核对提示',{来源:x.candidate_source,版面提示:x.first_page_layout_hint,文本相似度:x.first_page_parser_text_similarity,方法:x.similarity_method,问题:x.pypdf_extraction_status,说明:x.candidate_limitations})}else if(t.type==='fulltext'){appendText(left,'PDF 检查', {首页识别DOI:x.first_two_page_detected_dois,解析器:x.parser_results});appendText(right,'修复状态',{技术状态:x.current_technical_status,问题:x.current_issues,说明:x.repair_note})}else if(t.type==='year_policy'){appendText(left,'两篇日期与出处',x.papers);appendText(right,'规则说明',x.note)}else{appendText(left,'摘要',x.abstract||'摘要缺失');appendText(right,'研究线索与资料状态',{关键词线索:x.keyword_signals,建议:x.automatic_suggestion,不足:x.completeness_issues,说明:x.note})}
let current=get(t);let form=el('div');let label=el('label','审核决定');form.append(label);let sel=el('select');sel.append(new Option('尚未决定',''));for(let value of packet.choices[t.type])sel.append(new Option(translations[value]||value,value));sel.value=current.decision;form.append(sel);form.append(el('label','意见：修正位置、排除理由或不确定原因'));let note=el('textarea');note.value=current.notes;form.append(note);let save=el('button','保存此项决定');save.className='primary';save.onclick=()=>{let reviewer=document.getElementById('reviewer').value.trim();if(!reviewer||!sel.value){alert('请填写审核人并选择决定。');return}if(['correct','exclude'].includes(sel.value)&&!note.value.trim()){alert('请填写修正位置或排除理由。');return}state[id(t)]={status:'decided',decision:sel.value,reviewer,reviewed_at:new Date().toISOString(),notes:note.value.trim()};try{localStorage.setItem(key,JSON.stringify(state))}catch(e){alert('浏览器无法保存本地记录，请使用 CSV 模板。')}render()};form.append(save);if(current.status==='decided')form.append(el('p',`已记录：${current.reviewer} · ${current.reviewed_at}`));right.prepend(form)}
document.getElementById('download').onclick=()=>{let lines=packet.tasks.map(t=>JSON.stringify({type:t.type,uid:t.uid,doi:t.doi,title:t.title,object_sha256:t.object_sha256,...get(t)})).join('\n')+'\n';let a=el('a');a.href=URL.createObjectURL(new Blob([lines],{type:'application/x-ndjson'}));a.download='wos_review_decisions.jsonl';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('filter').onchange=render;document.getElementById('search').oninput=render;filters();render();
</script></body></html>
