<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首篇论文与摘要审核</title><style>
:root{color:#203631;background:#f4f7f5;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0}header{background:#153e38;color:#fff;padding:20px 4vw}header h1{font-size:22px;line-height:1.2;margin:0}header p{color:#d4e8df;margin:5px 0 0}main{max-width:1500px;margin:auto;padding:18px 22px 55px}button,input,select,textarea{font:inherit;border:1px solid #b7c9c1;border-radius:7px;background:white;color:#203631;padding:9px}button{cursor:pointer}button:hover{border-color:#1a715e}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #8ac8b3}.primary,.on{background:#176951;color:white;border-color:#176951}.toolbar,.tabs,.actions{display:flex;align-items:center;flex-wrap:wrap;gap:9px}.toolbar{margin:12px 0}.toolbar input{width:160px}.muted{color:#526c63}.notice{padding:11px 14px;border-radius:8px;background:#e9f4ed;color:#254c3c;margin:13px 0}.notice.warn{background:#fff3db;color:#684918}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:15px}.sidebar,.content{background:#fff;border:1px solid #dae5df;border-radius:10px}.sidebar{padding:11px;max-height:75vh;overflow:auto}.sidebar button{display:block;width:100%;text-align:left;margin-bottom:6px;font-size:13px}.sidebar small{display:block;font-weight:400}.sidebar .active{background:#e1f1e8;border-color:#59a788}.content{padding:20px;min-width:0}.content h2{margin:0 0 4px;font-size:21px}.columns{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:20px;margin-top:16px}.columns section{min-width:0}h3{font-size:16px;margin:5px 0 10px}.paper{border:1px solid #dce8e1;border-radius:8px;background:#fbfdfb;padding:13px;margin:10px 0}.paper strong{font-size:13px;color:#3d6658}.paper pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:7px 0;max-height:22em;overflow:auto;font:14px/1.6 ui-monospace,monospace}.columns img{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid #d4e2da}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}.content h2{overflow-wrap:anywhere}a{color:#146b52}label{display:block;font-weight:600;margin:12px 0 4px}textarea{width:100%;min-height:105px;resize:vertical}select{width:100%}details{margin:12px 0}details summary{cursor:pointer;color:#176951;font-weight:600}.small{font-size:13px}#message{min-height:1.5em}.badge{display:inline-block;border-radius:12px;background:#e8f3ec;color:#216047;padding:2px 9px;font-size:12px}.badge.pending{background:#f6f1df;color:#725c28}.choice{padding:8px 10px}.secondary{background:#eef6f1;color:#176951}.footnote{font-size:13px;color:#60756b}.count{font-weight:600}.extra{border-top:1px solid #dce8e1;margin-top:18px;padding-top:12px}@media(max-width:850px){main{padding:14px}.layout,.columns{grid-template-columns:1fr}.sidebar{max-height:210px}.content{padding:14px}.toolbar input{width:140px}}
</style></head><body><header><h1>论文证据审核</h1><p>首篇论文与 7 篇重点摘要 · 直接在本机操作，无需联网</p></header><main>
<div class="notice">先看左侧原文与页面，右侧填写你的判断。候选内容只是定位辅助；此前的人工审核决定已经保留。</div>
<div class="tabs"><button id="tab-pilot" class="on">① 首篇论文</button><button id="tab-abstract">② 重点摘要</button></div>
<div class="toolbar"><label for="reviewer" style="margin:0">审核人</label><input id="reviewer" placeholder="姓名或标识"><button id="download" class="primary">下载审核结果</button><span id="counts" class="count"></span></div>
<p class="footnote">审核过程中使用同一个浏览器可继续编辑；完成后请下载结果，并把文件交回 Codex。页面不会启动模型，也不会修改原始文献。</p>
<div class="layout"><aside class="sidebar" id="list" aria-label="审核项目"></aside><article class="content" id="detail"></article></div><p id="message" role="status"></p>
</main><script>
'use strict';const packet=__PACKET_JSON__;const storageKey='wos-pilot-web:'+packet.manifest_sha256;let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){saved={}};let kind='pilot';let selected=packet.tasks.find(t=>t.kind===kind);let occurrence=1;const $=id=>document.getElementById(id);const element=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e};const itemKey=(t,n=1)=>t.id+'#'+n;const empty=()=>({status:'pending',value:'',notes:'',reviewer:'',reviewed_at:''});const current=(t,n=1)=>saved[itemKey(t,n)]||empty();const label={reported:'原文有报告',not_reported:'核查后未报告',not_applicable:'不适用',uncertain:'暂不确定',accept:'接受新候选',correct:'需要进一步修正'};
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(saved));return true}catch(e){$('message').textContent='浏览器未能保存，请先下载结果并联系 Codex。';return false}}
function refreshCounts(){let done=packet.tasks.filter(t=>current(t).status!=='pending').length;$('counts').textContent=`已保存 ${done} / ${packet.tasks.length} 项`}
function renderList(){let box=$('list');box.replaceChildren();const list=packet.tasks.filter(t=>t.kind===kind);for(let t of list){let b=element('button');if(selected&&selected.id===t.id)b.className='active';let state=current(t);b.append(element('strong',t.title.replace(/<\/?i>/gi,'')),element('small',`${t.kind==='abstract'?t.doi+' · ':''}${state.status==='pending'?'待审核':'已保存：'+(label[state.status]||state.status)}`));b.onclick=()=>{selected=t;occurrence=1;render()};box.append(b)}}
function addPreview(container,file){if(!file)return;let a=element('a','点击放大原文页面');a.href=file.url;a.target='_blank';a.rel='noopener';let im=element('img');im.src=file.url;im.alt='论文原文页面预览';a.append(im);container.append(a)}
function textBox(parent,title,text){if(!text)return;let d=element('details');d.append(element('summary',title));let block=element('pre',text);d.append(block);parent.append(d)}
function renderDetail(){let panel=$('detail');panel.replaceChildren();if(!selected)return;let t=selected;panel.append(element('h2',t.title.replace(/<\/?i>/gi,'')),element('p',t.doi));let badge=element('span',current(t,occurrence).status==='pending'?'待审核':`已保存：${label[current(t,occurrence).status]}`);badge.className='badge'+(current(t,occurrence).status==='pending'?' pending':'');panel.append(badge);const cols=element('div');cols.className='columns';let left=element('section'),right=element('section');cols.append(left,right);panel.append(cols);left.append(element('h3','原文和核对材料'));right.append(element('h3','你的审核'));
let pdf=t.files.find(x=>x.role==='raw');if(pdf){let a=element('a','打开原始 PDF ↗');a.href=pdf.url+(t.kind==='pilot'?'#page='+t.content.pages[0]:'');a.target='_blank';a.rel='noopener';left.append(a)}
if(t.kind==='pilot'){
 let message=element('p',t.content.status_hint);message.className='muted small';left.append(message);if(t.id.includes('contradiction')||t.id.includes('conflict')){let warning=element('div','原文可能有冲突：先对照不同页，不确定可直接选择“暂不确定”。');warning.className='notice warn';left.append(warning)}
 for(let e of t.content.evidence){let card=element('div');card.className='paper';card.append(element('strong',`PDF 第 ${e.page} 页 · ${e.section_id} / ${e.paragraph_id}`),element('pre',e.evidence_text));let f=t.files.find(x=>x.role==='preview'&&((e.page===3&&x.path.endsWith('/page03.png'))||(e.page===5&&x.path.endsWith('/page05.png'))||(e.page===7&&x.path.endsWith('/page-07.png'))||(e.page===8&&x.path.endsWith('/page-08.png'))||(e.page===9&&x.path.endsWith('/page09-pdfium.png'))||(e.page===1&&x.path.endsWith('/page01-pdfium.png'))));if(f)addPreview(card,f);left.append(card)}
 let occurrences=Object.keys(saved).filter(k=>k.startsWith(t.id+'#')).map(k=>Number(k.slice(k.lastIndexOf('#')+1))).filter(Number.isInteger);let max=Math.max(1,...occurrences);if(max>1){let pick=element('select');pick.id='occurrence';for(let n=1;n<=max;n++)pick.add(new Option('第 '+n+' 条记录',n));pick.value=String(occurrence);pick.onchange=()=>{occurrence=Number(pick.value);render()};right.append(element('label','同一项目的多条记录'),pick)}
}else{
 let info=element('div',`上一次你的决定：${t.content.previous_decision==='accept'?'接受':'需要修正'}。这次仅审核新修订候选，不会覆盖上次决定。`);info.className='notice';left.append(info);let risks=element('p','本次核对重点：'+(t.content.risk_flags.join('；')||'核对摘要边界和阅读顺序'));risks.className='muted small';left.append(risks);for(let f of t.files.filter(x=>x.role==='preview'))addPreview(left,f);textBox(left,'上次填写的意见',t.content.previous_note);textBox(left,'旧摘要',t.content.old_text||'原记录没有摘要');textBox(left,'原始候选',t.content.source_candidate);let candidate=element('div');candidate.className='paper';candidate.append(element('strong','新的排版候选'),element('pre',t.content.proposed_text||'无候选'));left.append(candidate)
}
let state=current(t,occurrence);let sel=element('select');sel.id='decision';sel.add(new Option('请选择',''));let choices=t.kind==='pilot'?['reported','not_reported','not_applicable','uncertain']:['accept','correct','uncertain'];for(let c of choices)sel.add(new Option(label[c],c));sel.value=state.status==='pending'?'':state.status;right.append(element('label','审核状态'),sel);
let value=element('textarea');value.id='answer';value.placeholder=t.kind==='pilot'?'填写你确认的内容；也可先点击下方按钮引用原文。':'如需修改，可在这里写出建议文本（可选）。';value.value=state.value;right.append(element('label',t.kind==='pilot'?'人工参考内容':'建议文本'),value);
if(t.kind==='pilot'){let copy=element('button','引用第一段原文');copy.className='secondary';copy.onclick=()=>{value.value=t.content.evidence[0].evidence_text;sel.value='reported'};right.append(copy);let why=element('p','“未报告”请在充分核查后选择；不适用需说明原因。');why.className='footnote';right.append(why)}
let notes=element('textarea');notes.id='notes';notes.placeholder='可写下页码、修正位置或不确定的原因';notes.value=state.notes;right.append(element('label','备注'),notes);let actions=element('div');actions.className='actions';let save=element('button','保存这项');save.className='primary';save.onclick=()=>{let reviewer=$('reviewer').value.trim(),decision=sel.value;if(!reviewer||!decision){$('message').textContent='请先填写审核人并选择审核状态。';return}if(decision==='reported'&&!value.value.trim()){$('message').textContent='请填写或引用你确认的原文内容。';return}if(['not_reported','not_applicable'].includes(decision)&&value.value.trim()){$('message').textContent='“未报告”或“不适用”时请清空人工参考内容，并在备注中说明。';return}if(['correct','not_reported','not_applicable'].includes(decision)&&!notes.value.trim()){$('message').textContent='请填写修正位置或判断原因。';return}saved[itemKey(t,occurrence)]={status:decision,value:value.value.trim(),notes:notes.value.trim(),reviewer,reviewed_at:new Date().toISOString()};if(persist()){$('message').textContent='已保存。';render()}};actions.append(save);if(t.kind==='pilot'){let add=element('button','同项增加一条');add.onclick=()=>{let n=2;while(saved[itemKey(t,n)])n++;occurrence=n;render()};actions.append(add)}let next=element('button','下一项 →');next.onclick=()=>{let l=packet.tasks.filter(x=>x.kind===kind);selected=l[(l.findIndex(x=>x.id===t.id)+1)%l.length];occurrence=1;render();window.scrollTo({top:0,behavior:'smooth'})};actions.append(next);right.append(actions);if(state.status!=='pending')right.append(element('p',`记录人：${state.reviewer} · ${state.reviewed_at}`))
}
function render(){for(let k of ['pilot','abstract'])$('tab-'+k).className=kind===k?'on':'';renderList();renderDetail();refreshCounts()}
try{$('reviewer').value=localStorage.getItem(storageKey+':reviewer')||''}catch(e){}$('reviewer').addEventListener('input',()=>{try{localStorage.setItem(storageKey+':reviewer',$('reviewer').value)}catch(e){}});
for(let k of ['pilot','abstract'])$('tab-'+k).onclick=()=>{kind=k;selected=packet.tasks.find(t=>t.kind===k);occurrence=1;$('message').textContent='';render()};
$('download').onclick=()=>{let entries=[];for(let t of packet.tasks){let ids=Object.keys(saved).filter(k=>k.startsWith(t.id+'#')).map(k=>Number(k.slice(k.lastIndexOf('#')+1))).filter(n=>Number.isInteger(n)&&n>1);for(let n of [1,...ids.sort((a,b)=>a-b)])entries.push({task_id:t.id,kind:t.kind,doi:t.doi,object_sha256:t.object_sha256,occurrence:n,...current(t,n)})}let data={version:'pilot-review-results-v1',manifest_sha256:packet.manifest_sha256,entries};let a=element('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'}));a.download='首篇论文审核结果.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('message').textContent='已下载结果文件。请把文件发给 Codex，或告知保存路径。'};
render();
</script></body></html>
